# REOSA: Upstream-Sync als Pull Request im eigenen Fork (deploy/reosa/OVERLAY.md).
#
# 1. `main` nur per schnellem Vorlauf auf den Stand von bulwarkmail/webmail.
#    Hat Upstream seine Geschichte neu geschrieben, bricht der Lauf ab und
#    ändert nichts: Das ist eine Entscheidung für einen Menschen.
# 2. Zweig `sync/upstream-<datum>` von `reosa/integration`, `main` hinein.
#    Konflikte werden NIE automatisch aufgelöst: Dann bleibt der Merge
#    ungeschehen, und der PR beschreibt nur, was zu tun ist.
# 3. PR gegen `reosa/integration`. Kein Merge, kein Tag, kein Deploy.
name: "REOSA: Upstream-Sync"

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reosa-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'davdxpx/reosa-mail'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: main per schnellem Vorlauf
        run: |
          git remote add upstream https://github.com/bulwarkmail/webmail.git
          git fetch upstream main
          if ! git merge-base --is-ancestor HEAD upstream/main; then
            echo "::error::Upstream ist kein Nachfolger von main (Geschichte neu geschrieben). Nichts geändert; siehe deploy/reosa/OVERLAY.md."
            exit 1
          fi
          git merge --ff-only upstream/main
          git push origin HEAD:main

      - name: Sync-Zweig von reosa/integration
        id: merge
        run: |
          git config user.name "reosa-upstream-sync"
          git config user.email "reosa-upstream-sync@users.noreply.github.com"
          branch="sync/upstream-$(date -u +%Y-%m-%d)"
          git fetch origin reosa/integration
          git checkout -B "$branch" origin/reosa/integration
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Nichts Neues."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge --no-ff --no-edit origin/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            git commit --allow-empty -m "chore(reosa): Upstream-Sync mit Konflikt, von Hand lösen"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Pull Request gegen reosa/integration
        if: steps.merge.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          CONFLICT: ${{ steps.merge.outputs.conflict }}
        run: |
          body="Upstream-Sync nach deploy/reosa/OVERLAY.md. Erst grün, dann mergen; danach Tag und WEBMAIL_COMMIT in der Plattform."
          if [ "$CONFLICT" = "true" ]; then
            body="$body

          **Konflikt:** Der Merge von main ist NICHT enthalten. Lokal: \`git checkout $BRANCH && git merge origin/main\`, Konflikte nach der Tabelle in OVERLAY.md lösen, Vertragstest grün."
          fi
          gh pr create --base reosa/integration --head "$BRANCH" --draft \
            --title "chore: Upstream-Sync $(date -u +%Y-%m-%d)" --body "$body" || true
